# Experiment 6, round 3 (user request 7 Nov 2026, about 15:45): double the training data of round 2.
# Training: round-2 data + experiment-4 set train2 (147 new pump-weeks, seeds 46xxx: 11 "own" fleets, 6 stress seeds,
# 3 healthy fleets; build/train2, lr run pump-exp4-generate-train2-20261107).
# Fairness change against round 2: the experiment-4 "public" fleets (seeds 41101..41104) re-simulate the public fleet,
# so GEN-train-4110x-P08 / -P09 have the configuration and the fault schedule of the validation pumps PUMP-08 / PUMP-09.
# Round 3 does not train on these 8 copies; the P01..P07 copies (training pumps) stay.
# Validation: unchanged, PUMP-08/09 + val-new-45001 (5 pumps). Locked, never read: PUMP-10..12 and experiment-4 "test".
inherit: runpod-full.yaml

data:
  sources:
    - name: train-orig
      root: data/training/original
      events: [events_train.csv]
      benign: [benign_windows_train_validation.csv]
    - name: gen-train
      root_glob: ../data_analysis_experiment_4_generated/build/train/4*
      assets: public/assets.csv
      telemetry: public/telemetry
      events: [private/events_stress_all.csv, public/events_train.csv]
      benign: [public/benign_windows_train_validation.csv, public/benign_windows_stress.csv]
    - name: gen-healthy
      root_glob: ../data_analysis_experiment_4_generated/build/healthy/4*
      assets: public/assets.csv
      telemetry: public/telemetry
      events: [private/events_stress_all.csv, public/events_train.csv]
      benign: [public/benign_windows_train_validation.csv, public/benign_windows_stress.csv]
    - name: gen-selection
      root_glob: ../data_analysis_experiment_4_generated/build/selection/4*
      assets: public/assets.csv
      telemetry: public/telemetry
      events: [private/events_stress_all.csv, public/events_train.csv]
      benign: [public/benign_windows_train_validation.csv, public/benign_windows_stress.csv]
    - name: gen-train2
      root_glob: ../data_analysis_experiment_4_generated/build/train2/4*
      assets: public/assets.csv
      telemetry: public/telemetry
      events: [private/events_stress_all.csv, public/events_train.csv]
      benign: [public/benign_windows_train_validation.csv, public/benign_windows_stress.csv]
    - name: val-orig
      root: data/validation/original
      events: [events_validation.csv]
      benign: [benign_windows_train_validation.csv]
    - name: val-new
      root_glob: data/validation/new/4*
      assets: public/assets.csv
      telemetry: public/telemetry
      events: [public/events_train.csv]
      benign: [public/benign_windows_train_validation.csv]
  # gen-train: own fleets (GEN-train-<seed>-NN), stress (STRESS-NN) and public copies P01..P07 only (no P08/P09).
  train_assets: ["train-orig/*", "gen-train-*/GEN-train-*-[0-9][0-9]", "gen-train-*/STRESS-*", "gen-train-*/GEN-train-*-P0[1-7]",
                 "gen-healthy-*/*", "gen-selection-*/*", "gen-train2-*/*"]
  val_assets: ["val-orig/*", "val-new-*/*"]
  locked_assets: ["*/PUMP-10", "*/PUMP-11", "*/PUMP-12", "gen-test*/*", "*test-44*/*"]

train:
  max_steps: 16000                # about 1 pass over twice the round-2 windows at batch 64
  warmup_steps: 300
