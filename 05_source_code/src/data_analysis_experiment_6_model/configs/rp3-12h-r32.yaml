# Experiment 6 round 3: context 12h (720 min at 40 s cells = 1 080 cells), LoRA 32/64, round-2 data + train2, no PUMP-08/09 copies.
inherit: runpod-full2.yaml

run:
  name: rp3-12h-r32-v1

backbone:
  lora: {rank: 32, alpha: 64, dropout: 0.0}

input:
  minutes: 720
  sample_period_s: 40

predict:
  persistence_windows: 22         # 15 min at the 40 s window stride of this context (fixed rule, 7 Nov 2026)
